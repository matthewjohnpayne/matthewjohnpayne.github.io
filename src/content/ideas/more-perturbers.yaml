title: "What if there is more than one undiscovered planet?"
area: solar-system
paper: "2016AJ....152...80H"
citation: "Holman & Payne (2016), AJ 152, 80"
section: "Discussion: Model"
quote: "There are undoubtedly unknown solar system masses that are not included in our model, which are yet to be discovered, and which may be significant perturbers. There could be more than one additional massive and distant object, or there could be additional smaller and closer planets. Investigating the influence of more than one additional planet is beyond the scope of the present investigation."
since:
  checked: "2026-10-17"
  paragraphs:
    - "Ephemeris and tracking studies since 2016 have continued to test a single added planet. Fienga et al. (2020), using INPOP19a with Juno and reanalysed Cassini data, found no location of Planet Nine that significantly improved the residuals, and excluded a 5 Earth-mass planet closer than 500 au and a 10 Earth-mass planet closer than 650 au. Gomes, Murray, Gomes & Holman (2023) forecast, for one Planet X acting tidally on the known planets, a median mass uncertainty of 0.22 Earth masses × (d/400 au)^3; an Earth-mass or Mars-mass body should be detectable over 90% of the sky to 260 or 120 au respectively. They identify the fluctuating quadrupole of the Kuiper belt as the ultimate confusing background, and Gomes & Bernstein (2025) find that an occultation-based search would become limited by degeneracy with the uncertain masses of large moonless TNOs. Ephemerides already absorb the belt itself: Pitjeva & Pitjev (2018) integrate the 31 largest TNOs and fit a discrete ring for the rest, giving a total Kuiper-belt mass of (1.97 ± 0.35) × 10^-2 Earth masses, and Di Ruscio et al. (2020) fit the masses of TNO rings at Neptune's 2:1 and 3:2 resonances."
    - "The case for more than one unseen body has meanwhile grown on dynamical grounds. Lykawka & Ito (2023) proposed a 1.5–3 Earth-mass planet at a ~ 250–500 au, i ~ 30°, to explain detached, high-inclination and Sedna-like TNOs. Siraj, Chyba & Tremaine (2025) measured a warp of the mean plane of the distant Kuiper belt at 80–400 au (98% confidence) and attribute it most plausibly to a Mercury-to-Earth-mass planet at a ~ 100–200 au, which they note is distinct in mass and semimajor axis from the planet invoked for apsidal clustering. Iorio (2026) used bounds on Saturn's orbital precessions to examine Planet Nine, Planet X and this 'Planet Y' in turn, concluding that Planet Y could only be about Mercury-sized and beyond about 125 au, and that dedicated ephemeris reductions modelling such perturbers are still required."
    - "Holman, Napier, Payne et al. (2025) searched Pan-STARRS1 for distant planets and found none, though they recovered 642 TNOs; they conclude that the remaining parameter space for Planet Nine is concentrated in the Galactic plane. None of the papers listed here, as far as their abstracts show, fits two or more additional planets simultaneously to planetary ranging or to TNO astrometry."
  open:
    - "A joint astrometric or ephemeris fit with two perturbers, for example a distant Planet Nine plus a closer, Mercury-to-Earth-mass body at 100–200 au, quantifying how far their tidal signals can be separated or are degenerate."
    - "Whether the tidal field of an extended set of perturbers (several planets, large moonless TNOs, the Kuiper-belt quadrupole) can be distinguished from one planet with the data in hand and with LSST-era astrometry."
    - "Applying the Pluto and TNO astrometry approach of Holman & Payne (2016) with a two-planet model to the longer, Gaia-calibrated arcs now available."
