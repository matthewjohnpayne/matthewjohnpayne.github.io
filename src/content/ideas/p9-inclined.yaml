title: "How does a highly inclined Planet Nine shape the distant Kuiper belt?"
area: solar-system
paper: "2018AJ....156..263L"
citation: "Li, Hadden, Payne & Holman (2018), AJ 156, 263"
section: "Conclusion"
quote: "Configurations involving higher inclination Planet Nine may explain the clustering in Δω. This is consistent with the results of Batygin & Brown (2016) and Brown & Batygin (2016). A detailed analysis of the dynamics of a highly inclined Planet Nine is a promising future direction, which is beyond the scope of this paper."
note: "Δω is the difference between a distant TNO's argument of perihelion and Planet Nine's."
status: draft
order: 40
