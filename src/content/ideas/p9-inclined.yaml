title: "How does a highly inclined Planet Nine shape the distant Kuiper belt?"
area: solar-system
paper: "2018AJ....156..263L"
citation: "Li, Hadden, Payne & Holman (2018), AJ 156, 263"
section: "Conclusion"
quote: "Configurations involving higher inclination Planet Nine may explain the clustering in Δω. This is consistent with the results of Batygin & Brown (2016) and Brown & Batygin (2016). A detailed analysis of the dynamics of a highly inclined Planet Nine is a promising future direction, which is beyond the scope of this paper."
note: "Δω is the difference between a distant TNO's argument of perihelion and Planet Nine's."
since:
  checked: "2026-10-17"
  paragraphs:
    - "In secular theory the question has been taken up by Bhaskar, Li, Hadden, Payne & Holman (2021). Treating the Sun, Planet Nine and a distant TNO as a mildly hierarchical triple, they found that a polar or a counter-orbiting (retrograde) Planet Nine can also cluster the perihelia of the extreme TNOs, as a low-inclination one does, and that a polar Planet Nine gives a wider spread of TNO inclinations. Farhat & Touma (2021) extended the secular (Laplace-surface) theory to a distant, eccentric companion on an inclined orbit, and applied it to TNOs and a putative Planet Nine, finding islands in which TNOs are protected within chaotic seas."
    - "N-body studies have used or favoured modest inclinations instead. Fitting the observed distant TNOs, Brown & Batygin (2021) found i = 16° ± 5°, and report that inclinations above about 30° tend to break the clustering entirely; Ribeiro de Sousa et al. (2025) modelled Planet Nine at about 20°; and Siraj, Chyba & Tremaine (2025) found about 7° ± 5° for a possible distant planet. The smaller, Earth-like Kuiper-belt planet proposed by Lykawka & Ito (2023) is inclined by about 30°. None of these studies, as far as their abstracts and the Brown & Batygin text show, explored inclinations of 40° or more."
    - "The motivation has also weakened. With a larger sample, restricted to orbits stable against Neptune, Siraj, Chyba & Tremaine (2025) find clustering in longitude of perihelion at about 3σ but no significant clustering in argument of perihelion, inclination or node; and Napier et al. (2021) find no evidence of clustering once survey biases are accounted for."
  open:
    - "Full N-body simulations of a Planet Nine inclined by 40–90°, or retrograde, including Neptune and lasting the age of the Solar System, compared with the observed TNOs through each survey's biases."
    - "Whether such a planet can cluster the argument of perihelion without destroying the clustering in longitude of perihelion, if the clustering in argument of perihelion is real at all."
    - "Whether a polar Planet Nine's wider spread of TNO inclinations is consistent with the low-inclination distant TNOs that Planet Nine models are now asked to produce (Anderson & Kaib 2021; Bansal et al. 2026)."
    - "Predictions of the high-inclination and retrograde distant populations that the Rubin Observatory's LSST would see from a highly inclined Planet Nine."
