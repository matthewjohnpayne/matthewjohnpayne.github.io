title: "What protects close planet pairs in the 1:1 resonance?"
area: exoplanets
paper: "2013ApJ...774..129D"
citation: "Deck, Payne & Holman (2013), ApJ 774, 129"
section: "Resonance Overlap Scaling"
quote: "For intermediate mass planets, with initial orbital configurations M1 ≠ M2, a regular region appears corresponding to the 1:1 mean motion resonance. The 1:1 region will be explored in future work (Payne et al, in prep)."
note: "Inside the chaotic zone of two close planets, a regular island survives where the planets share an orbit."
since:
  checked: "2026-10-17"
  paragraphs:
    - "The promised follow-up (Payne et al., in prep) does not appear in ADS: no later paper by Payne on co-orbital, 1:1 or Trojan planets was found, and none of the roughly 175 papers citing Deck, Payne & Holman (2013) takes up the regular 1:1 region inside the overlap zone. Hadden & Lithwick (2018) extended the overlap criterion from first-order resonances to resonances of all orders, giving a critical eccentricity for chaos in two-planet systems up to orbit crossing; their abstract does not discuss the 1:1 resonance."
    - "The dynamics of two planets sharing an orbit has, however, been worked out in detail from the co-orbital side. Robutel & Pousse (2013) built an averaged Hamiltonian valid over the whole co-orbital region, with an integrable approximation for planar, quasi-circular motion. Leleu, Robutel & Correia (2018) followed the phase space to high eccentricity, finding that above about e = 0.5 (equal masses) the L4 and L5 domains become connected. Páez & Efthymiopoulos (2018) used the inner border of the lowest-order secondary resonance to estimate the region of effectively stable Trojan motion, and Prieur & Robutel (2026) showed that inclined co-orbital systems along Marchal's family can remain stable for masses above Gascheau's (Routh's) limit, but become highly unstable at mutual inclinations above 60°."
    - "Related work bears on whether such pairs exist. Leleu, Coleman & Ataiee (2019) derived a stability criterion for L4 and L5 under dissipation and slow mass change and found that disc migration can push pairs towards horseshoe orbits or out of resonance. In N-body assembly of compact super-Earth systems, about 1 per cent of final systems contain a co-orbital pair (Poon et al. 2020), and Raymond et al. (2023) found horseshoe constellations of up to 24 Earth-mass planets at 1 au that stay stable for billions of years. No co-orbital exoplanet pair has yet been confirmed (Balsalobre-Ruza et al. 2024)."
  open:
    - "A unified picture that places the regular 1:1 island inside the first-order overlap zone of Deck, Payne & Holman (2013): its width in period ratio and eccentricity as a function of planet masses, and where it meets the chaotic web."
    - "Why the island appears clearly for unequal masses (M1 ≠ M2) in that study, and how this depends on the initial phases and on the tadpole and horseshoe stability limits."
    - "Whether the island survives the eccentric, all-order overlap of Hadden & Lithwick (2018) and the presence of further planets in compact multi-planet systems."
