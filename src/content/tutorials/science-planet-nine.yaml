title: "Planet Nine and the Secular Dynamics of Distant TNOs"
summary: Reproduces the secular analysis of Li, Hadden, Payne & Holman (2018) by direct numerical averaging — checked against analytic rates and a REBOUND N-body run — and follows TNOs under an eccentric Planet Nine for four billion years, to see their orbits cluster and flip.
