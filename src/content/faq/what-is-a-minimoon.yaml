question: "What is a minimoon?"
topic: near-earth
level: intermediate
answer:
  - "A minimoon is a small asteroid temporarily captured by the Earth–Moon system: for a while it orbits Earth, then escapes back into an orbit around the Sun. Calculations by Granvik, Vaubaillon & Jedicke (2012) suggest that at any given time there should be at least one captured object about a metre across orbiting Earth."
  - "Only a few have been seen. *2006 RH120*, a few metres across (2–7 m, depending on how reflective it is), orbited within Earth's Hill sphere from July 2006 to July 2007. *2020 CD3*, about a metre across, was the second known; its area-to-mass ratio and colours ruled out an artificial origin. *2024 PT5*, discovered by ATLAS in August 2024, was captured from 29 September to 25 November 2024; its spectrum matches lunar rock, and it may be debris from an impact on the Moon."
  - "Minimoons are different from quasi-satellites such as Kamoʻoalewa, which orbit the Sun, outside Earth's Hill sphere, while a 1:1 resonance keeps them close to Earth. The [reference-frames page](/teaching/reference-frames/) on this site shows Kamoʻoalewa's motion in several frames."
