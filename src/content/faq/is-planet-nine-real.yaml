question: "Is Planet Nine real?"
topic: distant
level: intermediate
answer:
  - "Nobody knows yet: no such planet has been found. *Planet Nine* is a hypothesis. In 2016 Batygin and Brown showed that the orbits of the most distant known Kuiper Belt objects are clustered, with only a 0.007% probability of that being chance in their analysis, and that a distant, eccentric planet of about ten Earth masses or more could keep them aligned."
  - "A planet that far away would be very faint, so its gravity offers another way to look for it. Matt Holman and I (Holman & Payne 2016) asked whether its tidal pull on Saturn would show up in radio ranging to the Cassini spacecraft, and found that the measurements limit where in the sky such a planet could be. A companion study used the astrometry of Pluto and other trans-Neptunian objects in the same way."
  - "Direct searches continue. A 2025 search of Pan-STARRS1 data that I worked on with colleagues (Holman, Napier, Payne & Kurlander) found 692 Solar System objects, 109 of them not previously in the MPC's database, but no Planet Nine; it showed that the remaining room for Planet Nine is concentrated in the plane of the Milky Way."
  - "The interactive pages on this site let you explore the Cassini constraint and the long-term (secular) effect of a distant planet on trans-Neptunian orbits."
