question: "What does the Minor Planet Center do?"
topic: mpc
level: beginner
answer:
  - "The Minor Planet Center (MPC) describes itself as “the single worldwide location for receipt and distribution of positional measurements of minor planets,” comets and natural satellites. Observatories, surveys and amateur astronomers around the world send it their measurements of where these objects are in the sky and when."
  - "The MPC links those measurements to known objects or recognizes new ones, assigns designations, computes orbits, and maintains the master files of observations and orbits, which are freely available. Objects that look like possible near-Earth objects are posted on the NEO Confirmation Page so that other observers can follow them up."
  - "The MPC operates at the Smithsonian Astrophysical Observatory, part of the Center for Astrophysics | Harvard & Smithsonian, under Division F of the International Astronomical Union, and is funded by NASA. Matthew Payne is its Director."
