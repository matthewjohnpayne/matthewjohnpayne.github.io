question: "Will an asteroid hit Earth?"
topic: impacts
level: beginner
answer:
  - "Small pieces of asteroids and comets reach Earth all the time; most burn up in the atmosphere as meteors. The Torino Scale, used to rate possible impacts, puts such objects at level 0, “no hazard”."
  - "Larger objects are what planetary defense is about. NASA JPL's [Sentry](https://cneos.jpl.nasa.gov/sentry/) system automatically updates the orbit of every near-Earth asteroid as new observations arrive and checks whether it could hit Earth over at least the next 100 years. ESA keeps a similar [risk list](https://neo.ssa.esa.int/risk-list)."
  - "Most objects that appear on these lists are later removed. In Sentry's words, “by far the most likely outcome is that the object will eventually be removed as new observations become available.” The next questions explain the ratings and why this happens."
  - "For the current situation, check the Sentry and ESA risk lists directly: both give each object's Torino and Palermo ratings."
