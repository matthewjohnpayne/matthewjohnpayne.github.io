question: "What were ʻOumuamua, Borisov and 3I/ATLAS?"
topic: interstellar
level: beginner
answer:
  - "They are the three interstellar objects known so far: bodies that formed around other stars and are passing through the Solar System on hyperbolic orbits, not bound to the Sun. Each is seen only once, on its way in and out."
  - "*1I/ʻOumuamua* was found by the Pan-STARRS 1 telescope on Haleakalā in October 2017. Its orbit could not be bound to the Sun, so the MPC and the International Astronomical Union created a new designation series for interstellar objects, the “I” numbers. The name, chosen by the Pan-STARRS team, is Hawaiian and reflects the idea of a scout or messenger from the distant past. It looked red and extremely elongated (Meech et al. 2017), and its path showed a small non-gravitational acceleration (Micheli et al. 2018)."
  - "*2I/Borisov* was reported by Gennadiy Borisov on 30 August 2019 as a comet candidate; other observers confirmed its cometary activity, and in September 2019 its hyperbolic orbit and interstellar origin were confirmed. Unlike ʻOumuamua, it was clearly a comet."
  - "*3I/ATLAS* (C/2025 N1) was discovered by the ATLAS survey telescope in Chile on 1 July 2025. Earlier observations from June quickly showed a strongly hyperbolic orbit (eccentricity about 6), and there were tentative reports of a faint coma and a short tail. The Vera C. Rubin Observatory found it in commissioning images taken ten days before discovery (Chandler et al. 2026)."
  - "Many more are expected: Devin Hoover, Darryl Seligman and I (Hoover, Seligman & Payne 2022) estimated that Rubin's Legacy Survey of Space and Time will detect of order 15 interstellar objects over about ten years. The interactive page on this site shows where in the sky they should appear."
