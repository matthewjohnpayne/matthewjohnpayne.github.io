name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  # Rebuild daily, so the build-time copy of "Today at the MPC" stays fresh and a queued Object of
  # the Month appears on the first day of its month. GitHub pauses scheduled workflows in a public
  # repository after 60 days without commits; it emails first, and any commit or a click re-enables it.
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:
concurrency:
  group: pages   # one deployment at a time; scheduled and workflow-started runs queue
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the changelog and the pages' "Updated" dates come from git
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Update the changelog from git
        run: node tools/export_changelog.mjs
      - name: Build Astro site
        env:
          GITHUB_TOKEN: ${{ github.token }}   # notebook dates from the GitHub API, without the anonymous rate limit
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
