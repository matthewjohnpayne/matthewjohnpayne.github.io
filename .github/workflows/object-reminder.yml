name: Object of the Month reminder
# On the 20th of each month, check that a reviewed Object of the Month is queued for next month
# (tools/check_next_object.mjs). If not, open an issue, which GitHub emails to the repository owner.
on:
  schedule:
    - cron: '0 9 20 * *'   # 09:00 UTC on the 20th
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check next month's object
        id: check
        run: |
          set +e
          msg=$(node tools/check_next_object.mjs); rc=$?
          echo "ready=$([ $rc -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u -d "$(date -u +%Y-%m-15) +1 month" +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "$msg"
          { echo 'msg<<EOF'; echo "$msg"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - name: Open a reminder issue
        if: steps.check.outputs.ready == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.check.outputs.month }}
          MSG: ${{ steps.check.outputs.msg }}
        run: |
          title="Object of the Month for $MONTH"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "A reminder is already open."; exit 0
          fi
          gh issue create --title "$title" --body "$MSG

          The site switches to the next object on the 1st of the month (the daily build in deploy.yml). Objects that are not reviewed, or whose month has not come, are left off the live site."
